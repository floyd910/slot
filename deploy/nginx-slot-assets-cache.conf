# Include this file from the server block that serves the built Slot Games app.
# Asset URLs must change whenever their file contents change.
location ~* ^/(assets|media|img)/.*\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|mp3|mp4|ogg|opus|webm)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Keep the application shell revalidatable so deployments are discovered.
location = /index.html {
    try_files $uri =404;
    expires -1;
    add_header Cache-Control "no-cache" always;
}