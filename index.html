<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="shortcut icon" href="/favicon.ico?v=6" />
    <link rel="icon" type="image/png" href="/favicon.png?v=6" />
    <link rel="apple-touch-icon" href="/favicon.png?v=6" />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/assets/img/double-scene-bg.png"
    />
    <link rel="preload" href="/assets/fonts/roboto-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/prosto-one-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/playfair-display-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
        background: #050506;
      }

      .boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #050506;
      }

      .boot-loader__content {
        width: min(420px, calc(100vw - 48px));
        font-family: Roboto, Arial, sans-serif;
      }
      .boot-loader__progress {
        display: flex;
        flex-direction: column;
        width: 100%;
      }
      .boot-loader__track {
        position: relative;
        box-sizing: border-box;
        width: 100%;
        height: 12px;
        padding: 3px;
        overflow: hidden;
        border: 1px solid #c6b4dd25;
        border-radius: 4px;
        background: #0a0b12;
        box-shadow: 0 4px 20px #0005;
      }
      .boot-loader__track::after {
        content: "";
        position: absolute;
        inset: 3px;
        background: repeating-linear-gradient(90deg, transparent 0, transparent 17px, #0a0b1260 17px, #0a0b1260 19px);
        pointer-events: none;
      }
      .boot-loader__fill {
        width: 0%;
        height: 100%;
        border-radius: 1px;
        background: linear-gradient(90deg, #936137, #dfad58 55%, #ffe6a5);
        box-shadow: 0 0 15px #ffd37650;
      }
      .boot-loader__percent {
        margin-top: 12px;
        color: #f6d89a;
        font-size: 20px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
    </style>
    <title>Khiradmandi Makor iframe</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading game">
        <div class="boot-loader__content">
<div class="boot-loader__progress" aria-label="0% loaded">
            <div class="boot-loader__track">
              <div class="boot-loader__fill"></div>
            </div>
            <div class="boot-loader__percent">0%</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
